<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Interview Simulator</title>

  <style>
    :root {
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --background: #f4f7fb;
      --text: #172033;
      --muted: #5d6b82;
      --border: #dce3ef;
      --question-bg: #eef4ff;
      --feedback-bg: #ecfdf5;
      --history-bg: #fff7ed;
      --error: #b91c1c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 16px;
      font-family: Arial, sans-serif;
      color: var(--text);
      background: var(--background);
    }

    main {
      max-width: 760px;
      margin: auto;
      padding: 32px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 8px 26px rgba(15, 23, 42, 0.12);
    }

    h1 {
      margin-top: 0;
      color: #1e3a5f;
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .stats {
      display: flex;
      gap: 16px;
      margin: 20px 0;
    }

    .stat-card {
      flex: 1;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #f8fafc;
    }

    .stat-card p {
      margin: 0;
      color: var(--muted);
    }

    .stat-card strong {
      display: block;
      margin-top: 6px;
      font-size: 28px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: end;
      margin: 24px 0;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-weight: bold;
    }

    select,
    textarea {
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 10px;
      font: inherit;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      margin: 12px 0;
    }

    button {
      padding: 11px 18px;
      border: 0;
      border-radius: 7px;
      color: white;
      font: inherit;
      font-weight: bold;
      background: var(--blue);
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: var(--blue-dark);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .card {
      margin-top: 20px;
      padding: 20px;
      border-radius: 10px;
    }

    #question-box {
      background: var(--question-bg);
    }

    #feedback-box {
      background: var(--feedback-bg);
    }

    .feedback-score-badge {
      display: inline-block;
      padding: 6px 14px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 9999px;
      background: #16a34a;
      color: white;
      margin-bottom: 12px;
    }

    .feedback-section {
      margin-top: 12px;
    }

    .feedback-section h3 {
      font-size: 0.95rem;
      margin: 8px 0 4px 0;
      color: #166534;
    }

    .feedback-list {
      margin: 4px 0 0 18px;
      padding: 0;
      color: #14532d;
    }

    .feedback-meta {
      margin-top: 14px;
      font-size: 0.8rem;
      color: #15803d;
      border-top: 1px dashed #bbf7d0;
      padding-top: 8px;
    }

    #previous-answers-box {
      background: var(--history-bg);
    }

    .answer-item {
      padding: 12px;
      margin: 10px 0;
      border-radius: 7px;
      background: white;
      border: 1px solid #fed7aa;
      line-height: 1.5;
    }

    #status {
      min-height: 24px;
      margin-top: 10px;
      color: var(--muted);
    }

    #status.error {
      color: var(--error);
    }

    .hidden {
      display: none;
    }

    @media (max-width: 560px) {
      main {
        padding: 22px;
      }

      .stats {
        flex-direction: column;
      }

      .filters {
        align-items: stretch;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>AI Interview Simulator</h1>

    <section class="stats" aria-label="Interview statistics">
      <div class="stat-card">
        <p>Total questions</p>
        <strong id="question-count">0</strong>
      </div>

      <div class="stat-card">
        <p>Total answers</p>
        <strong id="answer-count">0</strong>
      </div>
    </section>

    <section class="filters" aria-label="Question filters">
      <div class="field">
        <label for="category-filter">Category</label>
        <select id="category-filter">
          <option value="">Any category</option>
        </select>
      </div>

      <div class="field">
        <label for="difficulty-filter">Difficulty</label>
        <select id="difficulty-filter">
          <option value="">Any difficulty</option>
        </select>
      </div>

      <button type="button" id="new-question-button">
        Get Random Question
      </button>
    </section>

    <p id="status" role="status"></p>

    <section id="question-box" class="card hidden">
      <p>
        <strong id="category"></strong>
        &middot;
        <strong id="difficulty"></strong>
      </p>

      <h2 id="question"></h2>

      <label for="answer">Your answer</label>
      <textarea
        id="answer"
        minlength="10"
        placeholder="Write your interview answer here..."
      ></textarea>

      <div class="button-row">
        <button type="button" id="submit-answer-button" disabled>
          Submit Answer
        </button>

        <button type="button" id="view-answers-button" disabled>
          View Previous Answers
        </button>
      </div>
    </section>

    <section id="feedback-box" class="card hidden">
      <h2>AI Evaluation & Feedback</h2>
      <div id="feedback-score-container"></div>
      <p id="feedback"></p>
      <div id="feedback-details"></div>
    </section>

    <section id="previous-answers-box" class="card hidden">
      <h2>Previous Answers</h2>
      <div id="previous-answers"></div>
    </section>
  </main>

  <script>
    const API_URL = "http://127.0.0.1:8000";

    let currentQuestionId = null;

    const categoryFilter = document.getElementById("category-filter");
    const difficultyFilter = document.getElementById("difficulty-filter");
    const newQuestionButton = document.getElementById("new-question-button");
    const submitAnswerButton = document.getElementById("submit-answer-button");
    const viewAnswersButton = document.getElementById("view-answers-button");
    const questionBox = document.getElementById("question-box");
    const feedbackBox = document.getElementById("feedback-box");
    const previousAnswersBox = document.getElementById("previous-answers-box");
    const statusMessage = document.getElementById("status");

    newQuestionButton.addEventListener("click", getRandomQuestion);
    submitAnswerButton.addEventListener("click", submitAnswer);
    viewAnswersButton.addEventListener("click", getPreviousAnswers);

    initializePage();

    async function initializePage() {
      try {
        setStatus("Loading interview data...");
        await Promise.all([getStats(), loadFilters()]);
        setStatus("");
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    async function fetchApi(path, options = {}) {
      const response = await fetch(`${API_URL}${path}`, options);

      let data = {};

      try {
        data = await response.json();
      } catch {
        throw new Error("The server returned an unreadable response.");
      }

      if (!response.ok) {
        throw new Error(data.detail || "Something went wrong.");
      }

      return data;
    }

    async function getStats() {
      const data = await fetchApi("/stats");

      document.getElementById("question-count").textContent =
        data.total_questions;

      document.getElementById("answer-count").textContent =
        data.total_answers;
    }

    async function loadFilters() {
      const data = await fetchApi("/questions?limit=100");
      const questions = data.questions || [];

      const categories = [...new Set(
        questions.map((question) => question.category)
      )].sort();

      const difficulties = [...new Set(
        questions.map((question) => question.difficulty)
      )].sort();

      addOptions(categoryFilter, categories, "Any category");
      addOptions(difficultyFilter, difficulties, "Any difficulty");
    }

    function addOptions(selectElement, values, defaultLabel) {
      selectElement.innerHTML = "";

      const defaultOption = document.createElement("option");
      defaultOption.value = "";
      defaultOption.textContent = defaultLabel;
      selectElement.appendChild(defaultOption);

      values.forEach((value) => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        selectElement.appendChild(option);
      });
    }

    async function getRandomQuestion() {
      newQuestionButton.disabled = true;
      feedbackBox.classList.add("hidden");
      previousAnswersBox.classList.add("hidden");
      setStatus("Finding a question...");

      try {
        const parameters = new URLSearchParams();

        if (categoryFilter.value) {
          parameters.append("category", categoryFilter.value);
        }

        if (difficultyFilter.value) {
          parameters.append("difficulty", difficultyFilter.value);
        }

        const query = parameters.toString();

        const path = query
          ? `/questions/random?${query}`
          : "/questions/random";

        const data = await fetchApi(path);
        const question = data.question;

        currentQuestionId = question.id;

        document.getElementById("category").textContent = question.category;
        document.getElementById("difficulty").textContent = question.difficulty;
        document.getElementById("question").textContent = question.question;
        document.getElementById("answer").value = "";

        questionBox.classList.remove("hidden");
        submitAnswerButton.disabled = false;
        viewAnswersButton.disabled = false;

        setStatus("");
      } catch (error) {
        setStatus(error.message, true);
      } finally {
        newQuestionButton.disabled = false;
      }
    }

    async function submitAnswer() {
      const answer = document.getElementById("answer").value.trim();

      if (!currentQuestionId) {
        setStatus("Please get a question first.", true);
        return;
      }

      if (answer.length < 10) {
        setStatus("Your answer must contain at least 10 characters.", true);
        return;
      }

      submitAnswerButton.disabled = true;
      setStatus("Submitting your answer...");

      try {
        const submission = await fetchApi(
          `/questions/${currentQuestionId}/answers`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ answer })
          }
        );

        await showFeedback(submission.answer_id);
        await getStats();

        setStatus("Answer submitted successfully.");
      } catch (error) {
        setStatus(error.message, true);
      } finally {
        submitAnswerButton.disabled = false;
      }
    }

    async function showFeedback(answerId) {
      const data = await fetchApi(`/answers/${answerId}/feedback`);

      const scoreContainer = document.getElementById("feedback-score-container");
      scoreContainer.innerHTML = `<span class="feedback-score-badge">Score: ${data.score} / 10</span>`;

      document.getElementById("feedback").textContent = data.feedback;

      const details = document.getElementById("feedback-details");
      details.innerHTML = "";

      if (data.technical_accuracy) {
        const accDiv = document.createElement("div");
        accDiv.className = "feedback-section";
        accDiv.innerHTML = `<h3>Technical Assessment</h3><p>${data.technical_accuracy}</p>`;
        details.appendChild(accDiv);
      }

      if (data.strengths && data.strengths.length > 0) {
        const strDiv = document.createElement("div");
        strDiv.className = "feedback-section";
        strDiv.innerHTML = `<h3>Strengths</h3><ul class="feedback-list">${data.strengths.map(s => `<li>${s}</li>`).join("")}</ul>`;
        details.appendChild(strDiv);
      }

      if (data.missing_points && data.missing_points.length > 0) {
        const missDiv = document.createElement("div");
        missDiv.className = "feedback-section";
        missDiv.innerHTML = `<h3>Areas for Improvement</h3><ul class="feedback-list">${data.missing_points.map(m => `<li>${m}</li>`).join("")}</ul>`;
        details.appendChild(missDiv);
      }

      const metaDiv = document.createElement("div");
      metaDiv.className = "feedback-meta";
      metaDiv.textContent = `Evaluator: ${data.evaluator || "AI Evaluator"} | Word count: ${data.word_count}${data.cached ? " (cached)" : ""}`;
      details.appendChild(metaDiv);

      feedbackBox.classList.remove("hidden");
    }

    async function getPreviousAnswers() {
      if (!currentQuestionId) {
        setStatus("Please get a question first.", true);
        return;
      }

      viewAnswersButton.disabled = true;
      setStatus("Loading previous answers...");

      try {
        const data = await fetchApi(
          `/questions/${currentQuestionId}/answers`
        );

        const answersList = document.getElementById("previous-answers");
        answersList.innerHTML = "";

        if (data.answers.length === 0) {
          answersList.textContent = "No answers have been submitted yet.";
        } else {
          data.answers.forEach((item, index) => {
            const answerItem = document.createElement("div");
            answerItem.className = "answer-item";
            answerItem.textContent = `${index + 1}. ${item.answer}`;
            answersList.appendChild(answerItem);
          });
        }

        previousAnswersBox.classList.remove("hidden");
        setStatus("");
      } catch (error) {
        setStatus(error.message, true);
      } finally {
        viewAnswersButton.disabled = false;
      }
    }

    function setStatus(message, isError = false) {
      statusMessage.textContent = message;
      statusMessage.classList.toggle("error", isError);
    }
  </script>
</body>
</html>
